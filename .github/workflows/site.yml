# Build the ngIRCd homepage with Zola.
#
# DRAFT: the site is built (and the result uploaded as an artifact) on every
# push and pull request, but publishing is disabled. To enable a deploy job
# below, remove its "if: false".

name: Site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZOLA_VERSION: "0.23.6"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin zola
      - name: Build
        run: zola build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Option 1: mirror on GitHub Pages at https://ngircd.github.io, published
  # from the repository ngircd/ngircd.github.io (its current meta-refresh
  # index.html gets replaced). One-time setup:
  # - ngircd/ngircd.github.io: add a deploy key with write access, and set
  #   Settings -> Pages -> Source to "Deploy from a branch", branch "master".
  # - ngircd/ngircd-web: store the private key as secret GITHUB_IO_DEPLOY_KEY.
  deploy-github-io:
    if: false
    needs: build
    runs-on: ubuntu-latest
    env:
      PAGES_REPO: git@github.com:ngircd/ngircd.github.io.git
      PAGES_BRANCH: master
    steps:
      - uses: actions/checkout@v4
      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin zola
      - name: Build for ngircd.github.io
        run: |
          zola build --base-url https://ngircd.github.io --output-dir site
          touch site/.nojekyll
      - name: Push to ngircd.github.io
        env:
          SSH_KEY: ${{ secrets.GITHUB_IO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id"
          git clone --depth 1 --branch "$PAGES_BRANCH" "$PAGES_REPO" pages
          git -C pages rm -rq --ignore-unmatch .
          cp -a site/. pages/
          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."; exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update site from ngircd-web ${GITHUB_SHA::8}"
          git push origin "HEAD:$PAGES_BRANCH"

  # Option 2: rsync to an own web server. Needs the secrets DEPLOY_SSH_KEY,
  # DEPLOY_KNOWN_HOSTS and DEPLOY_TARGET ("user@host:/path/").
  deploy-rsync:
    if: false
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
      - name: Upload
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: |
          mkdir -p public ~/.ssh && tar -xf artifact.tar -C public
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlv --delete --exclude=/pub/ -e "ssh -i ~/.ssh/id" public/ "$TARGET"
